services:
  pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: eira
      POSTGRES_USER: eira
      POSTGRES_PASSWORD: eira
    ports: ["5432:5432"]
    volumes: [eira-pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eira"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  eira-pg-data:
